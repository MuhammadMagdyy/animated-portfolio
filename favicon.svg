<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="neon" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ff0033" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff0033" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0b080c" />
  <circle cx="50" cy="50" r="30" fill="rgba(255,0,51,0.5)" filter="url(#glow)" />
  <circle cx="50" cy="50" r="26" fill="url(#neon)" />
</svg>
