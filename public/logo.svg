<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff0033" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff0033" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="#0b080c" />
  <circle cx="256" cy="256" r="180" fill="rgba(255,0,51,0.35)" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" />
</svg>
